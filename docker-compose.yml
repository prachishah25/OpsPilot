services:
  backend:
    build:
      context: ./backend
    container_name: opspilot-backend-container
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    container_name: opspilot-postgres-container
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot_dev_password
    ports:
      - "5432:5432"
    volumes:
      - opspilot-postgres-data:/var/lib/postgresql/data

volumes:
  opspilot-postgres-data: